<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhật ký của chúng mình</title>
<style>
:root{
  --primary:#E9A84E;--ink:#4A3A2E;--soft:#94816F;
  --paper:#FFFDF8;--paper2:#FBF4E8;--bg:#F6EDDD;
  --border:rgba(160,120,80,.25);--tape:rgba(233,168,78,.45);
}
body.t-dawn{--bg:#FFF2E4}
body.t-day{--bg:#F9F1E2}
body.t-dusk{--bg:#F7E7D2}
body.t-night{--bg:#EFE2CC}

*{margin:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);transition:background .8s}

.paper-bg{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(700px 420px at 80% -5%,rgba(255,244,222,.9),transparent 70%),
  radial-gradient(560px 380px at -5% 35%,rgba(247,220,190,.55),transparent 70%),var(--bg)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter><rect width="140" height="140" filter="url(%23n)"/></svg>')}
.vign{position:fixed;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 140px rgba(150,110,70,.12)}
.dust{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-12px;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,#E8B96F,transparent 70%);filter:blur(1px);
  opacity:0;animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(var(--s,1))}12%{opacity:.55}85%{opacity:.3}
  100%{opacity:0;transform:translateY(-105vh) scale(var(--s,1))}}
#wallpaper{position:fixed;inset:-24px;z-index:-1;background-size:cover;background-position:center;
  display:none;filter:blur(3px) saturate(1.05)}
#wallpaper::after{content:"";position:absolute;inset:0;background:rgba(250,240,222,.68)}

header{display:flex;align-items:center;gap:13px;padding:13px 22px;position:relative;z-index:5;
  background:linear-gradient(180deg,#FFFDF6,#FBF3E3);
  border-bottom:2px solid rgba(160,120,80,.16);
  box-shadow:0 2px 14px rgba(150,110,70,.08)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:repeating-linear-gradient(90deg,rgba(160,120,80,.10) 0 2px,transparent 2px 14px)}
.ava{width:52px;height:56px;background:#fff;display:grid;place-items:center;
  font-size:26px;position:relative;flex-shrink:0;transform:rotate(-2deg);
  border-radius:4px;padding:3px;
  box-shadow:0 4px 12px rgba(150,110,70,.22);
  outline:2px dashed rgba(160,120,80,.4);outline-offset:-6px}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:2px}
header.thinking .ava{transform:rotate(-2deg) scale(1.04)}
header.thinking .ava::after{content:"";position:absolute;inset:-6px;border-radius:6px;
  border:2px solid var(--primary);animation:ring 1.3s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.7}to{transform:scale(1.25);opacity:0}}
.diary-meta{flex:1;min-width:0}
h1{font-family:Georgia,'Palatino Linotype',serif;font-size:19px;font-weight:700;letter-spacing:.3px}
#mood{display:inline-flex;align-items:center;font-size:11.5px;color:#7A6650;
  background:rgba(255,252,244,.95);border:1px solid var(--border);
  padding:2px 10px;border-radius:3px;margin-top:3px;transition:opacity .18s;
  box-shadow:1px 1px 0 rgba(160,120,80,.15)}
.hbtns{display:flex;gap:7px}
.hbtns button{height:34px;border-radius:8px;border:1px solid var(--border);
  background:var(--paper);cursor:pointer;font-size:13px;color:var(--ink);
  position:relative;transition:.2s;padding:0 10px;font-family:inherit}
.hbtns button:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 10px rgba(150,110,70,.15)}
#cal-badge{position:absolute;top:-5px;right:-5px;background:#D97B5A;color:#fff;font-size:9.5px;
  min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px;font-weight:700}

main{flex:1;min-height:0;overflow-y:auto;padding:20px 18px 10px;display:flex;flex-direction:column;
  gap:14px;max-width:720px;width:100%;margin:0 auto;position:relative;z-index:2;
  scrollbar-width:thin;scrollbar-color:rgba(160,120,80,.3) transparent}
main::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb{background:rgba(160,120,80,.3);border-radius:99px}

.diary-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6vh 10px 8px}
.seal{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:52px;
  background:radial-gradient(circle at 35% 30%,#F8C989,var(--primary) 70%);
  color:#fff;position:relative;box-shadow:0 14px 34px rgba(150,110,70,.35),inset 0 3px 8px rgba(255,255,255,.4);
  animation:sealIn .9s cubic-bezier(.2,.9,.3,1.2) both}
.seal img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.seal::after{content:"";position:absolute;inset:8px;border-radius:50%;
  border:2px solid rgba(255,255,255,.5)}
@keyframes sealIn{from{transform:scale(.5) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.seal-cap{margin-top:8px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--soft)}
.hero-name{font-family:Georgia,'Palatino Linotype',serif;font-size:30px;font-weight:700;margin-top:10px;
  color:#5A4632}
.hero-tag{font-family:'Segoe UI',system-ui,sans-serif;font-style:italic;color:var(--soft);font-size:13.5px;
  margin-top:4px;letter-spacing:.2px}
.hero-rule{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:#C9A98A;font-size:13px}
.hero-rule::before,.hero-rule::after{content:"";width:54px;height:1px;
  background:linear-gradient(90deg,transparent,#D8B98C)}
.hero-rule::after{transform:scaleX(-1)}
.stickies{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;max-width:540px}
.sticky{font-family:inherit;font-size:13px;color:#5A4632;cursor:pointer;border:none;
  padding:12px 14px 14px;width:auto;max-width:180px;line-height:1.4;transition:.2s;position:relative;
  box-shadow:0 6px 14px rgba(150,110,70,.18);text-align:left}
.sticky:nth-child(odd){background:#FFF6D8;transform:rotate(-1.6deg)}
.sticky:nth-child(even){background:#FFE9E0;transform:rotate(1.4deg)}
.sticky:nth-child(3n){background:#E8F2E4}
.sticky:hover{transform:rotate(0) translateY(-3px);box-shadow:0 10px 22px rgba(150,110,70,.25)}
.sticky::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:44px;height:14px;background:var(--tape);border-left:1px dashed rgba(255,255,255,.6);
  border-right:1px dashed rgba(255,255,255,.6)}

.date-div{align-self:center;display:flex;align-items:center;gap:9px;font-size:11.5px;
  color:#8A7560;letter-spacing:1.5px;text-transform:uppercase;margin:6px 0 2px;
  font-weight:600}
.date-div::before,.date-div::after{content:"";width:36px;height:1px;background:#D8C3A2}
.date-div .ico{font-size:14px}

.msg{max-width:84%;padding:13px 16px 12px;position:relative;white-space:pre-wrap;
  line-height:1.6;font-size:14.5px;animation:in .4s cubic-bezier(.2,.7,.3,1) both;
  border-radius:3px}
.msg::before{content:"";position:absolute;top:-8px;width:52px;height:15px;
  background:var(--tape);opacity:.9;
  border-left:1px dashed rgba(255,255,255,.55);border-right:1px dashed rgba(255,255,255,.55)}
.msg:nth-child(odd){transform:rotate(-.35deg)}
.msg:nth-child(even){transform:rotate(.3deg)}
.ai{align-self:flex-start;background:var(--paper);border:1px solid rgba(160,120,80,.16);
  box-shadow:2px 4px 0 rgba(160,120,80,.07),0 8px 20px rgba(150,110,70,.10)}
.ai::before{left:14px;transform:rotate(-3deg)}
.user{align-self:flex-end;background:#FFF9E8;border:1px solid rgba(160,120,80,.18);
  box-shadow:-2px 4px 0 rgba(160,120,80,.07),0 8px 20px rgba(150,110,70,.10);
  border-left:3px solid var(--primary)}
.user::before{right:14px;left:auto;transform:rotate(3deg)}
@keyframes in{from{opacity:0;transform:translateY(12px) rotate(0)}to{opacity:1}}
.msg.user{animation-name:inU}
@keyframes inU{from{opacity:0;transform:translateY(12px) rotate(.6deg)}to{opacity:1;transform:rotate(.3deg)}}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:#C9A98A;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.msg .stamp{position:absolute;bottom:6px;right:9px;font-size:11px;opacity:.55}

.formwrap{padding:8px 18px 10px;position:relative;z-index:5}
.ibar{display:flex;gap:8px;align-items:center;max-width:720px;width:100%;margin:0 auto;
  background:var(--paper);border:1px solid var(--border);border-radius:4px;
  padding:6px 6px 6px 12px;box-shadow:0 10px 26px rgba(150,110,70,.14);position:relative}
.ibar::before{content:"📎";position:absolute;left:-13px;top:-11px;font-size:20px;
  transform:rotate(-24deg);filter:drop-shadow(0 2px 3px rgba(150,110,70,.3))}
input#i{flex:1;padding:12px 12px;border:none;background:transparent;color:var(--ink);
  outline:none;font-size:15px;font-family:inherit}
input#i::placeholder{color:#B7A492}
button[type=submit]{width:44px;height:44px;border-radius:50%;border:none;color:#fff;
  cursor:pointer;font-size:16px;flex-shrink:0;transition:.2s;
  background:radial-gradient(circle at 34% 30%,#F8C989,var(--primary) 72%);
  box-shadow:0 6px 14px rgba(150,110,70,.3),inset 0 2px 5px rgba(255,255,255,.4)}
button[type=submit]:hover:not(:disabled){transform:rotate(-8deg) scale(1.07)}
button[type=submit]:disabled{opacity:.55;cursor:wait;transform:none}
.hint{text-align:center;font-size:11.5px;color:var(--soft);padding:3px 20px 8px;
  font-family:Georgia,serif;font-style:italic}

#panel{position:fixed;top:0;right:-350px;width:330px;max-width:92vw;height:100%;z-index:60;
  background:var(--paper);border-left:1px solid var(--border);
  box-shadow:-12px 0 40px rgba(100,70,40,.15);transition:right .3s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column}
#panel.open{right:0}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.p-head b{font-family:Georgia,serif;font-size:17px}
.p-head button{border:none;background:none;font-size:16px;cursor:pointer;color:var(--soft)}
.p-add{padding:14px 18px;border-bottom:1px dashed var(--border)}
.p-add input[type=text]{width:100%;padding:10px 13px;border-radius:4px;border:1px solid var(--border);
  background:#fff;color:var(--ink);outline:none;font-family:inherit;font-size:14px}
.p-add input[type=text]:focus{border-color:var(--primary)}
.p-row{display:flex;gap:8px;margin-top:9px;align-items:center}
.p-row input[type=time],.p-row input[type=date]{flex:1;padding:8px 10px;border-radius:4px;
  border:1px solid var(--border);background:#fff;color:var(--ink);font-family:inherit;font-size:13px;outline:none;min-width:0}
.p-row label{font-size:12.5px;color:var(--soft);display:flex;gap:5px;align-items:center;white-space:nowrap;cursor:pointer}
.p-add button{width:100%;margin-top:10px;padding:10px;border-radius:4px;border:none;
  background:var(--primary);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px}
.p-list{flex:1;overflow-y:auto;padding:14px 18px;scrollbar-width:thin}
.p-sec{font-size:11.5px;font-weight:700;color:#A5722F;letter-spacing:2px;margin:14px 0 8px;text-transform:uppercase}
.p-sec:first-child{margin-top:0}
.trow{display:flex;align-items:center;gap:9px;padding:9px 11px;margin-bottom:8px;
  background:#FFFDF6;border:1px solid var(--border);border-radius:3px;position:relative}
.trow::before{content:"";position:absolute;top:-6px;left:12px;width:36px;height:11px;
  background:var(--tape);transform:rotate(-2deg);opacity:.8}
.trow input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px;flex-shrink:0}
.trow .tt{flex:1;font-size:13.5px;line-height:1.4;word-break:break-word}
.trow.done .tt{text-decoration:line-through;color:var(--soft)}
.trow .tmeta{font-size:11.5px;color:var(--soft);white-space:nowrap}
.trow button{border:none;background:none;color:#C9A98A;cursor:pointer;font-size:13px;padding:2px 4px}
.trow button:hover{color:#D95F3B}
.p-empty{font-size:13px;color:var(--soft);text-align:center;padding:18px 0;line-height:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="paper-bg"></div>
<div class="dust" id="dust"></div>
<div id="wallpaper"></div>

<header id="hd">
  <div class="ava" id="ava">🌷</div>
  <div class="diary-meta"><h1 id="ai-name">&nbsp;</h1><div id="mood">đang mở sổ...</div></div>
  <div class="hbtns">
    <button id="wp-clear" title="Xóa hình nền" style="display:none">✕</button>
    <button id="quit" title="Đóng sổ (tắt trợ lý)">⏻</button>
    <button id="wp-btn" title="Đổi hình nền">🖼</button>
    <button id="cal-btn" title="Lịch & việc cần làm">🗓<span id="cal-badge" style="display:none"></span></button>
    <button id="reset" title="Mở trang mới">🌿 Trang mới</button>
  </div>
</header>
<input type="file" id="wp-file" accept="image/*" style="display:none">

<main id="chat">
  <div class="diary-hero" id="chat-hero">
    <div class="seal" id="hero-orb">🌷</div>
    <div class="seal-cap">Trang đầu tiên của cuốn nhật ký</div>
    <div class="hero-name" id="hero-name">&nbsp;</div>
    <div class="hero-tag" id="hero-tag">mỗi ngày một dòng — mỗi dòng một điều ấm</div>
    <div class="hero-rule">✦</div>
    <div class="stickies" id="chips"></div>
  </div>
</main>

<aside id="panel">
  <div class="p-head"><b>🗓 Lịch & việc cần làm</b><button id="panel-close">✕</button></div>
  <div class="p-add">
    <input type="text" id="t-title" placeholder="Việc cần làm... VD: họp nhóm, uống thuốc" maxlength="60">
    <div class="p-row">
      <input type="time" id="t-time">
      <input type="date" id="t-date">
    </div>
    <div class="p-row">
      <label><input type="checkbox" id="t-daily"> Lặp hằng ngày 🔄</label>
    </div>
    <button id="t-add">Ghim vào lịch</button>
  </div>
  <div class="p-list" id="t-list"></div>
</aside>

<div class="formwrap">
  <form id="f">
    <div class="ibar">
      <input id="i" placeholder="Viết vào trang hôm nay..." autocomplete="off">
      <button type="submit">➤</button>
    </div>
  </form>
  <div class="hint">— chạy hoàn toàn trên máy của bạn, không gì rời khỏi trang sổ này —</div>
</div>

<script>
const MOODS={happy:'😊 đang vui vẻ',sad:'🥺 cảm nhận được bạn buồn',excited:'🤩 hào hứng',
  worried:'😟 hơi lo cho bạn',neutral:'🙂 bình thản',love:'🥰 thương bạn',sleepy:'😴 buồn ngủ rồi đó'};
let persona=null,history=[],busy=false,tasks=[],curMood='neutral';

const deepNFC=x=>{
  if(typeof x==='string')return x.normalize('NFC');
  if(Array.isArray(x))return x.map(deepNFC);
  if(x&&typeof x==='object'){const r={};for(const k in x)r[k]=deepNFC(x[k]);return r;}
  return x;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const scrollBottom=()=>{const c=document.getElementById('chat');c.scrollTop=1e9;};

function P(){
  const p=(persona&&persona.personality)||{};
  const raw=(p.traits||'')+' '+(p.speaking_style||'')+' '+(p.greeting||'');
  if(/xưng hô em|em với anh|gọi người dùng là anh|xưng em/i.test(raw))return{me:'em',you:'anh'};
  if(/em với chị|gọi người dùng là chị/i.test(raw))return{me:'em',you:'chị'};
  return{me:'tớ',you:'cậu'};
}

/* Sắc trời theo giờ */
(function(){
  const h=new Date().getHours();
  document.body.classList.add(h>=5&&h<10?'t-dawn':h<16?'t-day':h<19?'t-dusk':'t-night');
})();

/* Bụi vàng */
(function(){const box=document.getElementById('dust');
for(let i=0;i<12;i++){const s=document.createElement('i');
  s.style.left=Math.random()*100+'%';
  s.style.setProperty('--s',(0.5+Math.random()).toFixed(2));
  s.style.animationDelay=(Math.random()*18)+'s';
  s.style.animationDuration=(14+Math.random()*14)+'s';
  box.appendChild(s);}})();

/* NFC sweep — chữa dấu tách rời trên toàn trang */
function nfcSweep(){
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null);
  const nodes=[];let n;
  while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(n=>{const v=n.nodeValue;if(v&&v.normalize)n.nodeValue=v.normalize('NFC');});
}

/* Sticky-note gợi ý theo tính cách */
function chipsFor(){
  const{me,you}=P();
  const M={
    sassy:[["Chào nhóc 😏","chào nhóc nha"],["Kể chuyện gì vui đi","kể chuyện gì vui đi"],
           ["Nhắc mình 3 giờ mai họp","nhớ mình 3 giờ chiều mai họp nhóm nha"],["Cà khịa thử xem","mày bị đơ hơi à"]],
    soft:[["Chào bạn 🌷","chào bạn nha"],["Hôm nay mình hơi buồn","hôm nay mình hơi buồn"],
          ["Kể chuyện gì vui đi","kể chuyện gì vui đi"],["Nhắc mình uống nước nhé","nhớ nhắc mình uống nước nha"]],
    calm:[["Chào bạn","chào bạn nha"],["Hôm nay mình hơi buồn","hôm nay mình hơi buồn"],
          ["Sắp xếp việc hôm nay","hôm nay mình có việc gì không"],["Nhắc mình 3 giờ mai họp","nhớ mình 3 giờ chiều mai họp nhóm nha"]],
    hype:[["Chào bạn ⚡","chào nha"],["Mình hơi buồn...","hôm nay mình hơi buồn"],
          ["Kể chuyện gì vui đi!!","kể chuyện gì vui đi"],["Nhắc mình tập thể dục","nhớ nhắc mình tập thể dục mỗi sáng nha"]],
    lazy:[["Chào bạn...","chào bạn nha"],["Mình hơi buồn...","hôm nay mình hơi buồn"],
          ["Kể chuyện gì đó...","kể chuyện gì vui đi"],["Nhắc mình ngủ sớm nhé","nhớ nhắc mình 10 giờ tối đi ngủ nha"]],
    neutral:[["Chào bạn 💕","chào bạn nha"],["Hôm nay mình hơi buồn","hôm nay mình hơi buồn"],
          ["Kể chuyện gì vui đi","kể chuyện gì vui đi"],["Nhắc mình 3 giờ mai họp","nhớ mình 3 giờ chiều mai họp nhóm nha"]]};
  return M[traitProfile()]||M.neutral;
}
function traitProfile(){
  const t=(((persona&&persona.personality)||{}).traits||'').toLowerCase();
  if(/láo|kiêu|hung hăng|chửi|thô lỗ|cộc|tinh nghịch|nổi loạn|gắt|trẻ trâu/.test(t))return'sassy';
  if(/dịu|ấm |an yên|chữa lành|êm ái|dễ thương|yêu thương|chu đáo|lắng nghe|tinh tế/.test(t))return'soft';
  if(/điềm tĩnh|logic|lạnh|súc tích|ngăn nắp|chiến lược|thẳng thắn|thứ tự/.test(t))return'calm';
  if(/năng lượng|cổ vũ|nhiệt huyết|tích cực|háo hức|vui vẻ/.test(t))return'hype';

    img.onload=()=>{

      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);

function typeBubble(role,text,done){
  text=String(text).normalize('NFC');
  const b=add(role,'');
  b.querySelector('.stamp')?.remove();
  b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    b.textContent='';
    if(reduce){b.textContent=text;scrollBottom();if(done)done();return;}
    let i=0;
    (function tick(){
      if(i<=text.length){b.textContent=text.slice(0,i);i++;scrollBottom();
        setTimeout(tick,text.charAt(i-1)===' '?16:26);}
      else if(done)done();
    })();
  },650);
}

const visible=t=>{
  let s=String(t)
    .replace(/<think>[\s\S]*?<\/think>/gi,'')
    .replace(/<think>[\s\S]*$/i,'')
    /* Cắt token hệ thống + mọi thứ sau nó */
    .replace(/<\/?\|[a-z_]+[^>]*>[\s\S]*/i,'')
    .replace(/(^|\n)\s*(user|assistant|system|model)\s*>[\s\S]*/gi,'')
    /* Cắt khối markdown code */
    .replace(/```[\s\S]*?```/g,'')
    .replace(/^\s*(import|from|def |class |package |\/utils|\/main)\b[^\n]*(\n(?!\n)[^\n]*)*/gmi,'');
  /* Cắt lượt ảo model tự đóng vai chính mình */
  const nm=persona&&persona.name?String(persona.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'):'';
  if(nm)s=s.replace(new RegExp('(^|\\n)\\s*'+nm+'\\s*:[\\s\\S]*','i'),'');
  return s
    .replace(/\[mood:\w+\]/g,'')
    .replace(/\[mood:\w*$/,'')
    .replace(/\[task:[^\]]*\]/gi,'')
    .replace(/\[task:[^\]]*$/i,'')
    .replace(/\[[a-zA-Z]+\]/g,'')
    .replace(/[\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF]+/g,'')
    .trim();
};

const hasLoop=t=>/(\S+)(\s+\1){9,}/.test(t);
const cutLoop=t=>{
  const m=t.match(/^([\s\S]*?)(\S+)(\s+\2){3,}[\s\S]*$/);
  return m?(m[1]+m[2]+'…'):t;};

function harvestTasks(full){
  const re=/\[task:([^\]]+)\]/gi;let m,added=[];
  while(m=re.exec(full)){
    const parts=m[1].split('|').map(s=>s.trim().normalize('NFC'));
    let day=todayStr(),time='',title='';
    if(parts.length>=3){
      const d0=parts[0].toLowerCase();
      if(/mai|tomorrow/.test(d0)&&!/hôm nay|mốt/.test(d0))day=offsetStr(1);
      else if(/mốt/.test(d0))day=offsetStr(2);
      time=parts[1];title=parts.slice(2).join(' ');
    }else if(parts.length===2){time=parts[0];title=parts[1];}
    const tm=time.match(/(\d{1,2})[:h.](\d{2})/);
    if(tm)time=String(Math.min(23,+tm[1])).padStart(2,'0')+':'+tm[2];else time='';
    title=title.replace(/^[-—:\s]+/,'').slice(0,60);
    if(title){tasks.push({id:Date.now()+Math.random(),title,date:day,time,daily:false,done:false,notifiedOn:''});added.push(title);}
  }
  if(added.length){saveTasks();renderPanel();toast('🗓 '+cap(P().me)+' đã ghi: '+added.join(', '));}
}

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  if(busy)return;
  const inp=document.getElementById('i'),text=inp.value.trim();if(!text)return;
  inp.value='';
  const hero=document.getElementById('chat-hero');if(hero)hero.remove();
  add('user',text);history.push({role:'user',content:text});
  const btn=document.querySelector('button[type=submit]');
  busy=true;btn.disabled=true;btn.textContent='…';
  document.getElementById('hd').classList.add('thinking');
  const b=add('assistant','...');
  b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  let full='';
  for(let attempt=0;attempt<2;attempt++){
    full='';
    try{
      const base=(attempt===0?history.slice(-8):history.slice(-2));
      const res=await fetch('/v1/chat/completions',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'local',stream:true,temperature:attempt?0.55:0.75,
          repeat_penalty:1.18,max_tokens:200,
          messages:[{role:'system',content:sys()},...base]})});
      if(!res.ok){
        const t=await res.text().catch(()=>'');
        throw new Error('Server '+res.status+' — '+t.slice(0,150));
      }
      const rd=res.body.getReader(),dc=new TextDecoder();let buf='';
      while(true){
        const{done,value}=await rd.read();if(done)break;
        buf+=dc.decode(value,{stream:true});
        const lines=buf.split('\n');buf=lines.pop();
        for(const l of lines){
          if(!l.startsWith('data:'))continue;
          const d=l.slice(5).trim();if(d==='[DONE]')continue;
          try{
            full+=JSON.parse(d).choices[0].delta?.content||'';
            b.textContent=visible(full)||'...';
            const st=document.createElement('span');st.className='stamp';
            st.textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
            b.appendChild(st);
            scrollBottom();
          }catch(err){}
        }
      }
    }catch(err){
      if(attempt===0&&/generate parser|Server 400|Server 503/.test(err.message))continue;
      b.textContent='⚠️ Lỗi: '+err.message;
      document.getElementById('mood').textContent='😣 gặp trục trặc';
      document.getElementById('hd').classList.remove('thinking');
      busy=false;btn.disabled=false;btn.textContent='➤';
      return;
    }
    if(visible(full)&&!hasLoop(full))break;
  }
  document.getElementById('hd').classList.remove('thinking');
  busy=false;btn.disabled=false;btn.textContent='➤';

  let v=visible(full);
  if(hasLoop(v))v=cutLoop(v);
  if(!v||v.length<12){
    const{you}=P();
    b.textContent='Tớ bị lag một xíu 🥲 '+cap(you)+' nhắn lại giúp tớ nha!';
    document.getElementById('mood').textContent='😅 tớ bị lag';
    return;
  }
  harvestTasks(v);
  const mood=(full.match(/\[mood:(\w+)\]/)||[])[1]||'neutral';
  b.textContent=v;
  const st=document.createElement('span');st.className='stamp';
  st.textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  b.appendChild(st);
  setMood(mood);
  history.push({role:'assistant',content:v});
  try{localStorage.setItem('miko_history',JSON.stringify(history.slice(-40)));}catch(e){}
});

document.getElementById('reset').onclick=()=>{
  history=[];
  try{localStorage.removeItem('miko_history');}catch(e){}
  curMood='neutral';
  try{localStorage.setItem('miko_mood','neutral');}catch(e){}
  const c=document.getElementById('chat');c.innerHTML='';
  const av=String(persona.avatar||'🌷');
  const orb=document.createElement('div');orb.className='seal';orb.id='hero-orb';
  if(av.startsWith('data:image')){const im=document.createElement('img');im.src=av;orb.appendChild(im);}
  else orb.textContent=av;
  const cap1=document.createElement('div');cap1.className='seal-cap';cap1.textContent='Trang đầu tiên của cuốn nhật ký';
  const nm=document.createElement('div');nm.className='hero-name';nm.id='hero-name';nm.textContent=persona.name;
  const tg=document.createElement('div');tg.className='hero-tag';tg.id='hero-tag';
  tg.textContent='mỗi ngày một dòng — mỗi dòng một điều ấm';
  const rule=document.createElement('div');rule.className='hero-rule';rule.textContent='✦';
  const ch=document.createElement('div');ch.className='stickies';ch.id='chips';
  const hero=document.createElement('div');hero.className='diary-hero';hero.id='chat-hero';
  hero.appendChild(orb);hero.appendChild(cap1);hero.appendChild(nm);hero.appendChild(tg);hero.appendChild(rule);hero.appendChild(ch);
  c.appendChild(hero);
  renderChips();
  addDivider();
  document.getElementById('mood').textContent='đang mở sổ...';
  genGreeting().then(txt=>{
    const finalTxt=txt||(persona.personality&&persona.personality.greeting)||'Chào bạn 🌷 Trang đầu tiên bắt đầu từ đây!';
    document.getElementById('mood').textContent=MOODS[curMood]||'đang mở sổ...';
    typeBubble('assistant',finalTxt,()=>{
      history.push({role:'assistant',content:finalTxt});
      try{localStorage.setItem('miko_history',JSON.stringify(history.slice(-40)));}catch(e){}
    });
  });
};

document.getElementById('quit').onclick=()=>{
  if(!confirm('Đóng sổ cho đến lần cắm USB tới?'))return;
  document.getElementById('mood').textContent='Đóng sổ... ngủ ngon nhé 💤';
  const ctrl=parseInt(location.port||'8765')+100;
  try{fetch('http://127.0.0.1:'+ctrl+'/quit',{mode:'no-cors'}).catch(()=>{});}catch(e){}
  try{if(window.pywebview&&pywebview.api)pywebview.api.quit();}catch(e){}
  setTimeout(()=>{window.open('','_self');window.close();},600);
};

init();
</script>
